server {
    listen 80;
    server_name closeiq.yourdomain.com;

    # Redirect HTTP → HTTPS (remove this block if you're not using SSL)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name closeiq.yourdomain.com;

    # ── SSL ────────────────────────────────────────────────────────────────
    # Replace with your cert paths (Certbot example):
    ssl_certificate     /etc/letsencrypt/live/closeiq.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/closeiq.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Document root ──────────────────────────────────────────────────────
    root /var/www/closeiq;
    index index.html;

    # ── Caching ────────────────────────────────────────────────────────────
    # HTML: no cache (always fresh build)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Static assets: 1-year cache (fonts, images — if you add them)
    location ~* \.(woff2?|ttf|eot|svg|png|jpg|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"   always;
    add_header X-Content-Type-Options   "nosniff"      always;
    add_header Referrer-Policy          "strict-origin" always;
    # Allow the Anthropic API call from the browser (for Sage live reasoning)
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; \
         style-src  'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; \
         font-src   'self' https://fonts.gstatic.com; \
         connect-src 'self' https://api.anthropic.com; \
         img-src 'self' data:; \
         frame-ancestors 'none';"
        always;

    # ── SPA fallback ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip ───────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Logs ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/closeiq.access.log;
    error_log  /var/log/nginx/closeiq.error.log;
}
